<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日志查看 Log Viewer</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("child-theme") || "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=log-output-title-5" />
    <link rel="stylesheet" href="../nav.css?v=theme-icon-2" />
  </head>
  <body>
    <main class="log-stage" aria-label="日志查看界面">
      <section class="log-list frame-panel" aria-label="系统文档列表">
        <div class="panel-kicker">所有文档</div>
        <label class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="logSearch" type="search" placeholder="搜索" />
        </label>
        <div class="log-list-items" id="logListItems"></div>
      </section>

      <section class="document-stack frame-panel" aria-label="系统内文档">
        <div class="panel-kicker">关联文档</div>
        <div class="doc-chip-list" id="relatedDocs"></div>
      </section>

      <section class="input-card frame-panel" aria-label="输入内容">
        <div class="panel-kicker">输入内容</div>
        <div class="accordion" id="inputAccordion"></div>
      </section>

      <section class="process-card frame-panel" aria-label="生成过程">
        <div class="panel-kicker">生成过程</div>
        <h1 id="processTitle">Agent- Decision Core</h1>
        <div class="copy-stack" id="processCopy"></div>
      </section>

      <section class="result-card frame-panel" aria-label="输出内容">
        <div class="panel-kicker">输出内容</div>
        <h1 id="resultTitle">Execution Brief</h1>
        <div class="copy-stack" id="resultCopy"></div>
        <footer>
          <button id="copyResult" type="button">复制结果</button>
          <a id="openDebug" href="../调试台/index.html">打开调试</a>
        </footer>
      </section>
    </main>

    <nav class="bottom-page-nav" aria-label="页面导航">
      <div class="bottom-nav-rail">
        <a href="../index.html">进化树</a>
        <a href="../监视器/index.html">监视器</a>
        <a href="../Child-流程图/index.html">流程图</a>
        <a class="is-active" href="./index.html">日志查看</a>
        <a href="../调试台/index.html?v=debug-title-controls-11">调试台</a>
      </div>
    </nav>

    <script src="../theme.js?v=theme-icon-1"></script>
    <script src="./script.js?v=log-clean-ui-2"></script>
  </body>
</html>
